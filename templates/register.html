<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | MindCare AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>💜 Create Your Account</h1>
        <p class="intro">Welcome to MindCare AI</p>
        <p>Create an account to begin your personal wellness conversation.</p>

        {% if error %}
            <p class="note">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <p>
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       minlength="3" maxlength="30" required>
            </p>

            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       maxlength="254" required>
            </p>

            <p>
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       minlength="8" required>
            </p>

            <button type="submit" class="button">Create Account</button>
        </form>

        <p>Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
        <p class="note">Your conversations may contain personal information. Use a password you don't share with others.</p>
    </div>
</body>
</html>
